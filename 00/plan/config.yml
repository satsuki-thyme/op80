# 設定

base world: world-1

theme:

  main:
    contents: 自分一人でできることをあえて誰かに任せることも強さである
    gist:
      人を信じるとは自分の未来の一部をその人に預けること

  sub:
    - item: 信じる             = 裏切られる可能性があっても信じる
    - item: 頼る               = 助けを求めることは弱さなのか
    - item: 任せる             = 失敗するかもしれない相手に任せられるか
    - item: 期待する           = 期待は相手を励ますのか、縛るのか
    - item: 許す               = 過去の過ちと現在の人間を分けられるか
    - item: 約束する           = 守れないかもしれない約束に意味はあるか
    - item: 見守る             = 助けられるのに助けないことは正しいか
    - item: 教える             = 答えを与えることと成長させることの違い
    - item: 認める             = 自分より弱い者の価値を認められるか
    - item: 頼られる           = 誰かの期待をどこまで背負うべきか
    - item: 別れる             = 大切だからこそ送り出せるか
    - item: 選ばせる           = 相手の間違った選択を尊重できるか
    - item: 責任を負う         = 任せた相手が失敗したとき、誰の責任なのか
    - item: 弱さを見せる       = 最強の人間にも弱音を吐ける相手が必要なのか
    - item: 役割を譲る         = 自分が一番うまくできても、自分がやるべきとは限らない
    - item: 信じられる側になる = 自分が他人を信じるだけでなく、他人から信頼されるには何が必要か

concept:
  contents: 神にも勝る最強無敵の主人公があえて魔王を倒す勇者を探す旅をしたら
  gist:
    ^

intention:
  1. 大小の課題を解決していく面白さを読者に提供する
  2. 主人公は武力において最強だが他の物事で苦労する
